name: Develop CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:

      # ============================
      # MySQL
      # ============================
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: micro_user_db

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # ============================
      # 1. Checkout source code
      # ============================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================
      # 2. Setup Java 21
      # ============================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ============================
      # 3. Start Kafka
      # ============================
      - name: Start Kafka
        run: |
          docker compose up -d kafka

      # ============================
      # 4. Verify Kafka container
      # ============================
      - name: Verify Kafka
        run: |
          echo "Checking Kafka container..."
          docker ps

      # ============================
      # 5. Wait for Kafka
      # ============================
      - name: Wait for Kafka
        run: |
          echo "Waiting for Kafka to be ready..."

          for i in {1..30}; do

            if docker exec kafka \
              /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 > /dev/null 2>&1; then

              echo "Kafka is ready!"
              break

            fi

            echo "Kafka is not ready yet..."
            sleep 2

          done

      # ============================
      # 6. Wait for MySQL
      # ============================
      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready..."

          for i in {1..30}; do

            if docker exec $(docker ps -q --filter ancestor=mysql:8.0) \
              mysqladmin ping \
              -h localhost \
              -uroot \
              -proot \
              --silent; then

              echo "MySQL is ready!"
              break

            fi

            echo "MySQL is not ready yet..."
            sleep 2

          done

      # ============================
      # 7. Create application databases
      # ============================
      - name: Create application databases
        run: |
          docker exec $(docker ps -q --filter ancestor=mysql:8.0) \
            mysql -uroot -proot -e "

              CREATE DATABASE IF NOT EXISTS micro_user_db;

              CREATE DATABASE IF NOT EXISTS micro_order_db;

              CREATE DATABASE IF NOT EXISTS micro_payment_db;

            "

      # ============================
      # 8. Verify databases
      # ============================
      - name: Verify application databases
        run: |
          docker exec $(docker ps -q --filter ancestor=mysql:8.0) \
            mysql -uroot -proot -e "SHOW DATABASES;"

      # ============================
      # 9. Build and test
      # ============================
      - name: Build and test
        run: |
          mvn -B clean verify

      # ============================
      # 10. Stop Kafka
      # ============================
      - name: Stop Kafka
        if: always()
        run: |
          docker compose down