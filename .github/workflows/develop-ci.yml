name: Develop CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: micro_user_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Wait for MySQL
      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready..."

          for i in {1..30}; do
            if docker exec $(docker ps -q --filter ancestor=mysql:8.0) \
              mysqladmin ping -h localhost -uroot -proot --silent; then
              echo "MySQL is ready!"
              break
            fi

            echo "MySQL is not ready yet..."
            sleep 2
          done

      # 4. Create all application databases
      - name: Create application databases
        run: |
          docker exec $(docker ps -q --filter ancestor=mysql:8.0) \
            mysql -uroot -proot -e "
              CREATE DATABASE IF NOT EXISTS micro_user_db;
              CREATE DATABASE IF NOT EXISTS micro_order_db;
              CREATE DATABASE IF NOT EXISTS micro_payment_db;
            "

      # 5. Verify databases
      - name: Verify application databases
        run: |
          docker exec $(docker ps -q --filter ancestor=mysql:8.0) \
            mysql -uroot -proot -e "SHOW DATABASES;"

      # 6. Build and run tests
      - name: Build and test
        run: mvn -B clean verify