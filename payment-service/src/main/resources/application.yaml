server:
  port: 8083

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/micro_payment_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.haatech.paymentservice.event.OrderCreatedEvent
        spring.json.trusted.packages: com.haatech.paymentservice.event